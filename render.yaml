# Blueprint de Render — GymTracker (PWA estática Vite)
# Migrado desde Railway. No hay backend ni DB: todo el estado vive en
# localStorage, así que esto es un Static Site servido desde el CDN de Render.
services:
  - type: web
    runtime: static
    name: gymtracker
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true

    # SPA + PWA: cualquier ruta que no sea un archivo real cae a index.html.
    # Render sirve primero los archivos existentes (assets, sw.js, manifest),
    # así que el rewrite solo afecta rutas de cliente.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # El service worker y su registro NO deben cachearse: si el navegador
      # sirve un sw.js viejo, la PWA queda pegada a un build anterior.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /sw-custom.js
        name: Cache-Control
        value: no-cache
      - path: /registerSW.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Los assets vienen con hash en el nombre → inmutables, cache agresivo.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
